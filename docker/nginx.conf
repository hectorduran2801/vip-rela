server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 25m;           # subida del Excel

  location /api/ {
    # Se resuelve en cada petición: si la API se reinicia y cambia de dirección, nginx la sigue.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:3100;
    proxy_pass $api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 180s;          # una importación grande tarda
  }

  # Estos nunca se guardan en caché: así llegan las actualizaciones.
  location ~* ^/(index\.html|ngsw\.json|ngsw-worker\.js)$ { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
